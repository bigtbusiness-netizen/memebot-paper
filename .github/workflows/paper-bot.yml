name: paper-bot

on:
  schedule:
    - cron: '0 */5 * * *'     # 00,05,10,15,20 UTC; each run lasts ~5h45m, overlaps queue (see concurrency)
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Paper-trading minutes for this run (max ~340)'
        required: false
        default: '340'

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

env:
  TZ: Asia/Nicosia
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  GMGN_CLI_VERSION: '1.7.2'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_demo.py

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install -g gmgn-cli@${GMGN_CLI_VERSION}
          echo "GMGN_CLI=$(command -v gmgn-cli)" >> "$GITHUB_ENV"
          gmgn-cli --version || true

      - name: Restore state branch
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git worktree add -q state-wt FETCH_HEAD
            (cd state-wt && git checkout -q -B state)
            [ -f state-wt/trades.csv ] && cp state-wt/trades.csv trades.csv
            echo "restored: $(wc -l < trades.csv 2>/dev/null || echo 0) trade rows"
          else
            git worktree add -q --detach state-wt
            (cd state-wt && git checkout -q --orphan state && git rm -rqf . && \
             printf '# state branch\nBot state written by the paper-bot workflow. Paper only.\n' > README.md)
            echo "new state branch"
          fi

      - name: Smoke test GMGN API (read-only)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          if [ -z "$GMGN_API_KEY" ]; then echo "GMGN_API_KEY secret missing"; exit 1; fi
          timeout 30 gmgn-cli market trenches --chain sol --type new_creation --limit 3 --raw > /tmp/smoke.json 2>&1 || true
          python3 - <<'PY'
          import json, re, sys
          s = open("/tmp/smoke.json").read()
          try:
              d = json.loads(s)
              n = len(d.get("new_creation") or []) if isinstance(d, dict) else len(d)
              print(f"GMGN OK: {n} new_creation rows ({len(s)} bytes)")
          except Exception:
              print("GMGN smoke test FAILED:", re.sub(r"[A-Za-z0-9_+=]{32,}", "<redacted>", s)[:400])
              sys.exit(1)
          PY
          rm -f /tmp/smoke.json

      - name: Run paper bot
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          touch demo.log
          tail -n 0 -F demo.log &
          TAIL=$!
          # early saves at 5 and 15 min give a quick health signal, then every 30 min
          ( sleep 300; bash scripts/save_state.sh; sleep 600; bash scripts/save_state.sh; while sleep 1800; do bash scripts/save_state.sh; done ) &
          SAVER=$!
          rc=0
          # hard cap below the job timeout; demo.py handles SIGTERM cleanly (paper-closes, final stats)
          timeout --signal=TERM --kill-after=120 $(( RUN_MINUTES * 60 + 600 )) python demo.py || rc=$?
          kill $SAVER $TAIL 2>/dev/null || true
          echo "bot exit code $rc"
          exit $rc

      - name: Save final state
        if: always()
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          bash scripts/save_state.sh
          [ -f stats.json ] && python3 -c "import json;s=json.load(open('stats.json'));print({k:s.get(k) for k in ('final','counts','realized_pnl_usd','total_pnl_usd','win_rate','error_count','api')})" || true
          cat state-wt/SUMMARY.md 2>/dev/null | head -8 || true
